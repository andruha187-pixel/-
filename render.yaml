services:
  - type: web
    name: powerwinner-wallet-observer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: WALLET
        value: 0xf3531b23b504cf0aed4ff21325232b2a2d496685
      - key: POLL_INTERVAL
        value: "5"
      - key: POSITIONS_INTERVAL
        value: "300"
      - key: BOOTSTRAP_LOOKBACK_HOURS
        value: "6"
      - key: BOOK_RETENTION_HOURS
        value: "24"
      - key: DATA_DIR
        value: ./data
